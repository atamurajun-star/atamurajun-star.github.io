<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" >
  <title>Privacy Policy — JUN ATAMURA</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
  <!-- Google Font : Jost -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin >
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet" >
  <link rel="stylesheet" href="css/style.css" >
  <style>

    /* =========================================
       PRIVACY PAGE
    ========================================== */

    .privacy-page {

      min-height: 100svh;

      position: relative;

    }


    /* =========================================
       PRIVACY CONTENT
    ========================================== */

    .privacy-content {

      position: absolute;

      top: 52%;

      right: 8vw;

      transform: translateY(-50%);

      width: min(520px, 70vw);

      text-align: right;

    }


    .privacy-title {

      margin: 0 0 40px;

      font-size: 13px;

      font-weight: 400;

      letter-spacing: 0.15em;

    }


    .privacy-text {

      margin: 0;

      font-size: 20px;

      line-height: 1.45;

      font-weight: 300;

      letter-spacing: 0.03em;

    }


    /* =========================================
       COPYRIGHT
    ========================================== */

    .copyright {

      margin-top: 50px;

      font-size: 11px;

      line-height: 1.5;

      letter-spacing: 0.08em;

    }


    /* =========================================
       BACK BUTTON
    ========================================== */

    .back-button {

      position: absolute;

      left: 5vw;

      bottom: 40px;

      font-size: 10px;

      letter-spacing: 0.15em;

      color: var(--header-amber);

      transition: opacity 0.2s ease;

    }


    .back-button:hover {

      opacity: 0.4;

    }


    /* =========================================
       MOBILE
    ========================================== */

    @media (max-width: 700px) {


      .privacy-content {

        top: 50%;

        right: 7vw;

        width: 80vw;

      }


      .privacy-title {

        margin-bottom: 30px;

        font-size: 11px;

      }


      .privacy-text {

        font-size: 18px;

        line-height: 1.5;

      }


      .copyright {

        margin-top: 40px;

        font-size: 10px;

      }


      .back-button {

        left: 5vw;

        bottom: 30px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="header">


    <!-- MENU BUTTON -->

    <button
      class="menu-button"
      id="menuButton"
      aria-label="Open menu"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>



    <!-- BRAND -->

    <div class="header-brand">

      <a href="index.html">

        <img
          src="images/junatamura.png"
          alt="JUN ATAMURA"
          class="brand-logo"
        >

      </a>


      <div class="brand-tagline">

        objects / garments<br>
        for the off-peak hours.

      </div>

    </div>



    <!-- EMPTY RIGHT SIDE -->

    <div class="cart-button">

      <!-- Empty -->

    </div>


  </header>



  <!-- =========================================
       MENU
  ========================================== -->

  <nav
    class="menu"
    id="menu"
  >

    <div class="menu-inner">

      <a href="index.html#items">
        ITEMS
      </a>

      <a href="index.html#about">
        ABOUT
      </a>

      <a href="terms.html">
        TERMS
      </a>

      <a href="privacy.html">
        PRIVACY
      </a>

    </div>

  </nav>



  <!-- =========================================
       PRIVACY POLICY
  ========================================== -->

  <main class="privacy-page">


    <section class="privacy-content">


      <h1 class="privacy-title">

        PRIVACY POLICY

      </h1>


      <p class="privacy-text">

        We collect nothing<br>
        that you did not leave behind.<br>
        We remember nothing<br>
        that you did not forget.

      </p>


      <div class="copyright">

        © JUN ATAMURA™<br>
        All rights reserved.

      </div>


    </section>



    <!-- BACK -->

    <a
      href="index.html"
      class="back-button"
    >

      [ ◁ BACK ]

    </a>


  </main>



  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    const menuButton =
      document.getElementById("menuButton");

    const menu =
      document.getElementById("menu");


    menuButton.addEventListener(
      "click",
      () => {

        menu.classList.toggle("open");

        menuButton.classList.toggle("active");

      }
    );


    const menuLinks =
      document.querySelectorAll(".menu a");


    menuLinks.forEach(
      (link) => {

        link.addEventListener(
          "click",
          () => {

            menu.classList.remove("open");

            menuButton.classList.remove("active");

          }
        );

      }
    );

  </script>


</body>

</html>
